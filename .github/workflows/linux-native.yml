name: Linux native plugin and live tester

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Immutable commit to build for a release caller
        required: false
        type: string
      release_assets_only:
        description: Upload only flattened GitHub Release assets
        required: false
        default: false
        type: boolean
      source_date_epoch:
        description: Reproducible archive timestamp from the release commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linux-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-native:
    name: Build Linux x86-64 .so and CPython 3.14 tester
    # Endstone supports Ubuntu 22.04 and Debian 12 as its Linux floor. Native
    # release binaries must be linked on that floor, not on a newer runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch || '315532800' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/native-build-requirements.txt
      - name: Install pinned Endstone Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          llvm_key="$RUNNER_TEMP/llvm-snapshot.gpg.key"
          llvm_keyring="$RUNNER_TEMP/apt.llvm.org.gpg"
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$llvm_key"
          fingerprint="$(gpg --show-keys --with-colons "$llvm_key" \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          gpg --batch --yes --dearmor --output "$llvm_keyring" "$llvm_key"
          sudo install -m 0644 "$llvm_keyring" /usr/share/keyrings/apt.llvm.org.gpg
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-18.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang-18 clang-tools-18 libc++-18-dev libc++abi-18-dev ninja-build
          clang_version="$(clang-18 --version)"
          grep -F 'clang version 18.1.8' <<<"$clang_version"
          command -v clang-scan-deps-18
      - name: Install pinned native build tools
        run: python -m pip install -r .github/native-build-requirements.txt
      - name: Classify the exact native gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          manifest=native/manifests/linux-x64-1.26.33.1.json
          if python tools/verify_native_manifest.py "$manifest"; then
            test -s src/verified_bds_26_30_adapter.cpp
            echo "mode=verified" >> "$GITHUB_OUTPUT"
            echo "verified_bridge=ON" >> "$GITHUB_OUTPUT"
          else
            python tools/verify_fail_closed.py
            echo "mode=gate-closed" >> "$GITHUB_OUTPUT"
            echo "verified_bridge=OFF" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore Conan package cache
        id: conan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: linux-x64-jammy-conan-clang18-${{ hashFiles('conanfile.py', 'native/profiles/linux-x64', '.github/native-build-requirements.txt') }}
          restore-keys: linux-x64-jammy-conan-clang18-
      - name: Resolve Conan dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Endstone publishes project-specific source recipes (including
          # funchook and RakNet) here; they are not available from Conan Center.
          conan remote add endstone https://conan.cloudsmith.io/endstone/conan/ \
            --index 0 --force
          conan install . -of build-conan --build=missing \
            -pr:h native/profiles/linux-x64 \
            -pr:b native/profiles/linux-x64 \
            -o '&:bds_build=1.26.33'
      - name: Save Conan package cache
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Configure the exact Linux plugin graph
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-linux-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build-conan/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENDSTONE_DYNAMIC_PROPERTIES_BUILD_PLUGIN=ON \
            -DENDSTONE_DYNAMIC_PROPERTIES_BUILD_LIVE_PYTHON=ON \
            -DENDSTONE_DYNAMIC_PROPERTIES_BUILD_TESTS=ON \
            -DENDSTONE_DYNAMIC_PROPERTIES_BUILD_EXAMPLES=ON \
            -DENDSTONE_DYNAMIC_PROPERTIES_VERIFIED_NATIVE_BRIDGE=${{ steps.gate.outputs.verified_bridge }} \
            -DENDSTONE_BDS_BUILD=1.26.33 \
            -DENDSTONE_BDS_PACKAGE=1.26.33.1
      - name: Build and run hosted tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-linux-native --parallel 2
          ctest --test-dir build-linux-native --output-on-failure
      - name: Stage plugin and build exact tester wheel
        shell: bash
        run: |
          set -euo pipefail
          stage="$PWD/stage/linux-x64"
          cmake --install build-linux-native --prefix "$stage"
          bridge="$stage/python/_endstone_dynamic_properties_live$(python3-config --extension-suffix)"
          python scripts/build_test_wheel.py \
            --bridge "$bridge" \
            --stage-dir "$stage" \
            --output-dir "$PWD/dist/linux-x64"
      - name: Inspect Linux artifact boundaries
        shell: bash
        run: |
          set -euo pipefail
          stage="$PWD/stage/linux-x64"
          plugin="$stage/plugins/endstone_dynamic_properties_api.so"
          bridge="$(find "$stage/python" -maxdepth 1 \
            -name '_endstone_dynamic_properties_live*.so' -type f -print -quit)"
          test -s "$plugin"
          test -n "$bridge"
          test -s "$bridge"
          file "$plugin" | grep -F "ELF 64-bit LSB shared object, x86-64"
          if readelf -d "$plugin" | grep -E '(RPATH|RUNPATH)'; then
            echo "Installed plugin contains a forbidden RPATH/RUNPATH" >&2
            exit 1
          fi
          for binary in "$plugin" "$bridge"; do
            maximum_glibc="$(readelf --version-info "$binary" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
              | sed 's/^GLIBC_//' | sort -Vu | tail -n 1)"
            test -n "$maximum_glibc"
            printf '%s highest imported glibc symbol: GLIBC_%s\n' \
              "$(basename "$binary")" "$maximum_glibc"
            if dpkg --compare-versions "$maximum_glibc" gt '2.35'; then
              echo "Release binary exceeds the Ubuntu 22.04 GLIBC_2.35 ceiling" >&2
              exit 1
            fi
          done
          wheel_count="$(find "$stage/plugins" -maxdepth 1 -name '*.whl' -type f | wc -l)"
          test "$wheel_count" -eq 1
          mkdir -p "$stage/evidence"
          if [[ "${{ steps.gate.outputs.mode }}" == "verified" ]]; then
            printf '%s\n' \
              'VERIFIED: the exact Linux manifest, reviewed bridge, and stage evidence passed.' \
              > "$stage/evidence/BUILD_MODE.txt"
          else
            printf '%s\n' \
              'GATE CLOSED: this ELF validates compilation and packaging only.' \
              'It refuses to register the live service and is not deployable as a working API.' \
              > "$stage/evidence/BUILD_MODE.txt"
          fi
          find "$stage" -type f ! -path '*/evidence/SHA256SUMS.txt' -printf '%P\n' | sort \
            | while IFS= read -r path; do sha256sum "$stage/$path"; done \
            > "$stage/evidence/SHA256SUMS.txt"
      - name: Create canonical native release assets
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$PWD/stage/linux-x64/plugins" -maxdepth 1 \
            -name '*.whl' -type f -print -quit)"
          python scripts/package_native_release.py \
            --stage-dir "$PWD/stage/linux-x64" \
            --wheel "$wheel" \
            --output-dir "$PWD/dist/release-linux-x64" \
            --mode "${{ steps.gate.outputs.mode }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.release_assets_only }}
        with:
          name: linux-native-${{ steps.gate.outputs.mode }}
          path: |
            stage/linux-x64
            dist/linux-x64/*.whl
            dist/release-linux-x64/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.release_assets_only }}
        with:
          name: release-linux-native
          path: dist/release-linux-x64/*
          if-no-files-found: error
          retention-days: 14
