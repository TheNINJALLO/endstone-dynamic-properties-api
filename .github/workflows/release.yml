name: Draft release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release identity and policy
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.release_identity.outputs.commit_sha }}
      source_date_epoch: ${{ steps.release_identity.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Verify release tag
        run: python scripts/verify_release_tag.py --tag "$RELEASE_TAG"
      - name: Resolve immutable release identity
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          commit_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          source_date_epoch="$(git show -s --format=%ct "${commit_sha}")"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=${source_date_epoch}" >> "$GITHUB_OUTPUT"
      - run: python scripts/verify_project_metadata.py
      - run: python tools/verify_fail_closed.py
      - name: Confirm the verified complete-control gate remains closed
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/verified_bds_26_30_adapter.cpp
          for manifest in native/manifests/*-1.26.33.1.json; do
            if python tools/verify_native_manifest.py "$manifest"; then
              echo "Experimental release unexpectedly contains a verified native gate" >&2
              exit 1
            fi
          done

  python-distributions:
    name: Python wheel and sdist
    needs: validate
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/release-requirements.txt
      - name: Install release tools and project
        run: |
          python -m pip install -r .github/release-requirements.txt
          python -m pip install -e .
      - name: Run Python tests
        run: python -m pytest -q tests/python
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Test wheel in isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/dynamic-properties-release-wheel
          /tmp/dynamic-properties-release-wheel/bin/python -m pip install --no-deps dist/*.whl
          pushd /tmp >/dev/null
          /tmp/dynamic-properties-release-wheel/bin/python - <<'PY'
          from endstone_dynamic_properties import AccessContext, CollectionRef
          from endstone_dynamic_properties import DynamicPropertyService, DynamicPropertyTarget

          api = DynamicPropertyService()
          context = AccessContext("release-wheel-smoke")
          collection = api.access_policy.plugin_collection(context.plugin_id, "smoke")
          ref = CollectionRef(DynamicPropertyTarget.world(), collection)
          assert api.set(ref, "ready", True, context).ok
          assert api.get(ref, "ready", context).value is True
          PY
          popd >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error

  portable-sdk:
    name: SDK ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Configure, build, and test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENDSTONE_DYNAMIC_PROPERTIES_BUILD_TESTS=ON \
            -DENDSTONE_DYNAMIC_PROPERTIES_BUILD_EXAMPLES=ON \
            -DENDSTONE_DYNAMIC_PROPERTIES_BUILD_PLUGIN=OFF
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Install and archive portable SDK
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package="endstone-dynamic-properties-api-${version}-${{ matrix.platform }}"
          cmake --install build --config Release --prefix "stage/${package}"
          python scripts/package_portable_sdk.py \
            --input "stage/${package}" \
            --output "dist/${package}.zip" \
            --prefix "${package}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  linux-native:
    name: Linux plugin and bound CPython 3.14 tester
    needs: validate
    uses: ./.github/workflows/linux-native.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.commit_sha }}
      release_assets_only: true
      source_date_epoch: ${{ needs.validate.outputs.source_date_epoch }}

  draft-release:
    name: Create draft GitHub release
    needs: [validate, python-distributions, portable-sdk, linux-native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_COMMIT: ${{ needs.validate.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          remote_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$remote_commit" != "$VALIDATED_COMMIT" ]]; then
            echo "Release tag moved: validated ${VALIDATED_COMMIT}, now ${remote_commit}" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc)\.[0-9]+$ ]]; then
            prerelease=true
          fi

          if is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace assets on published release ${RELEASE_TAG}" >&2
              exit 1
            fi
            if [[ "$prerelease" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --draft --prerelease --latest=false
            fi
            gh release upload "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_flags=()
            if [[ "$prerelease" == "true" ]]; then
              release_flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Endstone Dynamic Properties API ${RELEASE_TAG}" \
              "${release_flags[@]}"
          fi

          expected_assets="$(find artifacts -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Draft release asset set does not exactly match this build." >&2
            echo "Expected:" >&2
            printf '%s\n' "$expected_assets" >&2
            echo "Actual:" >&2
            printf '%s\n' "$actual_assets" >&2
            exit 1
          fi
